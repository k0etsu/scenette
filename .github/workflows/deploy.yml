# Reusable workflow: the actual build+deploy steps, called by deploy-dev.yml
# and deploy-prod.yml with different (environment, stack, IAM role) inputs
# rather than duplicating the whole job in both. Environment-specific
# gating (e.g. the "prod" GitHub Environment's deployment-branch policy
# restricting it to main) still applies via the `environment:` field below,
# unaffected by living in a shared workflow -- it's evaluated per-call using
# whatever `environment` input the caller passed.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      stack-name:
        required: true
        type: string
      role-arn:
        required: true
        type: string
      aws-region:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment -- rapid successive pushes to the
    # same branch previously could (and, before this existed, once did)
    # trigger overlapping `cdk deploy` runs against the same CloudFormation
    # stack, where a second UPDATE_IN_PROGRESS on top of a still-running one
    # just fails outright. cancel-in-progress stays false: a deploy that's
    # already underway should always finish rather than being cut off
    # mid-stack-update, so later pushes queue behind it instead of
    # cancelling it.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: cdk deploy ${{ inputs.stack-name }}
        working-directory: infra
        run: npx cdk deploy ${{ inputs.stack-name }} --require-approval never
