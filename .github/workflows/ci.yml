# Validates PRs, including from forks, before merge -- deliberately requests
# no permissions and touches no secrets/OIDC, since it only builds/lints/
# synths and never deploys. Deliberately NOT triggered on `push`: pushes to
# a branch also fire deploy-dev.yml, which builds as the first step of its
# own single job and simply stops (skipping the deploy step) if that build
# fails -- so a second, separate build-only workflow on every push added no
# extra safety, just duplicate npm ci/build work on every branch push.
name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR supersedes the last one -- no point finishing a
# stale validation run, unlike an actual deploy (see deploy.yml) where an
# in-progress run must never be cut off mid-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run tests
        run: npm test

      - name: CDK synth (no deploy)
        working-directory: infra
        run: npx cdk synth --all
