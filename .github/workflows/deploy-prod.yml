name: Deploy (prod)

# Deploys Scenette-prod only on merge to main. The prod IAM role's OIDC trust
# policy is scoped to this repo's `environment:prod` subject claim, and the
# "prod" GitHub Environment has a deployment branch policy restricting it to
# `main` only — so even a compromised dev-deploy credential can't reach prod,
# and no branch other than main can ever obtain a token for this role.
on:
  push:
    branches: [main]

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      stack-name: Scenette-prod
      role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
      aws-region: ${{ vars.AWS_REGION }}
