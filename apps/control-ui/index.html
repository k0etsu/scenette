<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>scenette control ui</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1e1f24;
        color: #eee;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #26272e;
        border-bottom: 1px solid #333;
      }
      #status {
        margin-left: auto;
        font-size: 13px;
        color: #9aa;
      }
      #canvas-container {
        position: relative;
        width: 100%;
        height: calc(100% - 45px);
        overflow: hidden;
        background: #14151a;
        cursor: default;
      }
      #canvas-container img,
      #canvas-container video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      #canvas-container [data-asset-type="text"] {
        color: white;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px;
        box-sizing: border-box;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="add-text-button">Add text</button>
      <label style="cursor: pointer">
        Upload
        <input id="upload-input" type="file" accept="image/*,video/*,audio/*" style="display: none" />
      </label>
      <span id="status"></span>
    </div>
    <div id="canvas-container"></div>
    <script src="./main.js"></script>
  </body>
</html>
