<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>scenette control ui</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1e1f24;
        color: #eee;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #26272e;
        border-bottom: 1px solid #333;
      }
      #status {
        margin-left: auto;
        font-size: 13px;
        color: #9aa;
      }
      #canvas-container {
        position: relative;
        width: 100%;
        height: calc(100% - 45px);
        overflow: hidden;
        background: #14151a;
        cursor: default;
      }
      #canvas-container img,
      #canvas-container video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      #canvas-container [data-asset-type="text"] {
        color: white;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px;
        box-sizing: border-box;
        pointer-events: auto;
      }
      #login-view {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      #login-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 260px;
        padding: 24px;
        background: #26272e;
        border-radius: 8px;
      }
      #login-form input {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #1e1f24;
        color: #eee;
      }
      #login-form .buttons {
        display: flex;
        gap: 8px;
      }
      #login-form .buttons button {
        flex: 1;
      }
      #login-error {
        color: #ff6b6b;
        font-size: 13px;
        min-height: 16px;
      }
      #app-view {
        display: none;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="login-view">
      <form id="login-form">
        <input id="login-username" type="text" placeholder="Username" autocomplete="username" />
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
        <div id="login-error"></div>
        <div class="buttons">
          <button id="login-button" type="submit">Log in</button>
          <button id="register-button" type="button">Register</button>
        </div>
      </form>
    </div>
    <div id="app-view">
      <div id="toolbar">
        <button id="add-text-button">Add text</button>
        <label style="cursor: pointer">
          Upload
          <input id="upload-input" type="file" accept="image/*,video/*,audio/*" style="display: none" />
        </label>
        <button id="grant-access-button">Grant room access</button>
        <button id="logout-button">Log out</button>
        <span id="status"></span>
      </div>
      <div id="canvas-container"></div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
