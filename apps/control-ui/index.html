<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>scenette control ui</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1e1f24;
        color: #eee;
        font-family: system-ui, sans-serif;
        overflow: hidden;
        /* A fast mouse drag over asset labels/panel text (dragging an
           asset, panning, or just moving quickly across the sidebar)
           otherwise starts a native text selection, which paints every
           text node the cursor crosses with the browser's blue selection
           highlight -- distracting and not an actual feature here, since
           there's no text in this app worth copy-selecting outside of
           form fields. Re-enabled explicitly on inputs/textareas below. */
        user-select: none;
        -webkit-user-select: none;
      }
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
      }
      #app-view {
        display: none;
        flex-direction: column;
        height: 100%;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #26272e;
        border-bottom: 1px solid #333;
      }
      #status {
        margin-left: auto;
        font-size: 13px;
        color: #9aa;
      }
      .toolbar-button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #34353e;
        border: 1px solid #454650;
        color: #eee;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        box-sizing: border-box;
      }
      .toolbar-button:hover {
        background: #3a3b44;
        border-color: #4da3ff;
      }
      #dashboard-button {
        display: inline-flex;
        align-items: center;
        background: none;
        border: none;
        color: #4da3ff;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        padding: 6px 4px;
      }
      #dashboard-button:hover {
        text-decoration: underline;
      }
      #main-area {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      /* Top/bottom split: two independently-scrolling halves, each taking
         half the sidebar's height regardless of how much content is in the
         other -- matches the reference tool's layout, where the top half
         (sound/objects/connected-users/variables) and the bottom half
         (the selected asset's controls) scroll separately rather than one
         long shared column. */
      #sidebar {
        width: 280px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #24252b;
        border-right: 1px solid #333;
      }
      #sidebar-top, #sidebar-bottom {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      #sidebar-top {
        border-bottom: 1px solid #333;
      }
      #stream-preview-panel, #sound-panel, #objects-panel, #connected-users-panel, #variables-panel, #properties-panel {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        background: #2b2c34;
        margin: 8px 8px 0;
        border-radius: 6px;
        padding: 8px;
        box-sizing: border-box;
      }
      #variables-panel, #properties-panel {
        margin-bottom: 8px;
      }
      /* Objects is the one card that still benefits from an internal cap +
         scroll (a room can easily have far more assets than fit on screen)
         -- a fixed budget here keeps it from pushing every other card in
         the top half out of view. */
      #objects-panel {
        max-height: 260px;
      }
      .panel-collapsed > *:not(.sidebar-header) {
        display: none !important;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 600;
        color: #ccc;
        padding: 2px 2px 8px;
        flex-shrink: 0;
      }
      .objects-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .object-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      .object-row:hover {
        background: #34353e;
      }
      .object-row.selected {
        background: #3a4a63;
      }
      .object-icon {
        flex-shrink: 0;
      }
      .object-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar-icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        color: #ccc;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 4px;
        border-radius: 3px;
        flex-shrink: 0;
        line-height: 0;
      }
      .sidebar-icon-button:hover {
        background: #454650;
      }
      .sidebar-icon-button.danger:hover {
        background: #6b2b2b;
      }
      .playback-button {
        width: 28px;
        height: 28px;
        border: 1px solid #454650;
        background: #34353e;
      }
      #properties-panel {
        display: none;
      }
      .properties-buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .sidebar-flip-button {
        flex: 1;
        background: #34353e;
        border: 1px solid #454650;
        color: #ccc;
        border-radius: 4px;
        padding: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .sidebar-flip-button.active {
        background: #4da3ff;
        color: #12151a;
        border-color: #4da3ff;
      }
      .prop-label {
        display: block;
        font-size: 11px;
        color: #999;
        margin: 6px 0 2px;
      }
      .prop-row-pair {
        display: flex;
        gap: 8px;
      }
      .prop-row-pair > div {
        flex: 1;
      }
      .prop-slider-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 6px 0 2px;
      }
      .prop-slider-row .prop-label {
        margin: 0;
      }
      #properties-panel .prop-slider-number {
        /* flex-basis (not width) so this reliably wins the main-axis size
           against the #properties-panel input[type="number"] rule's
           width: 100% below -- flex-basis takes priority over width for a
           flex item's sizing regardless of which rule has higher CSS
           specificity or comes later in the stylesheet. */
        flex: 0 0 64px;
        min-width: 0;
      }
      #properties-panel input[type="number"],
      #properties-panel textarea,
      #variables-panel input,
      #variables-panel select {
        width: 100%;
        box-sizing: border-box;
        background: #1e1f24;
        border: 1px solid #454650;
        color: #eee;
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 13px;
      }
      #properties-panel input[type="range"],
      #sound-panel input[type="range"] {
        width: 100%;
      }
      .presence-row, .variable-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 2px;
        font-size: 13px;
      }
      .presence-elapsed {
        margin-left: auto;
        color: #999;
        font-size: 12px;
      }
      .variable-name {
        flex: 1;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .variable-name:hover {
        text-decoration: underline;
      }
      .variable-stepper {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .variable-value {
        min-width: 24px;
        text-align: center;
        font-size: 13px;
      }
      .variable-value-text {
        color: #999;
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .variables-help {
        font-size: 12px;
        color: #999;
        line-height: 1.4;
        margin: 8px 0;
      }
      .variables-help code {
        background: #1e1f24;
        border-radius: 3px;
        padding: 1px 4px;
      }
      .variables-form {
        margin-top: 8px;
        border-top: 1px solid #383838;
        padding-top: 8px;
      }
      .prop-checkbox {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: #ccc;
      }
      #canvas-container {
        position: relative;
        flex: 1;
        overflow: hidden;
        background: #14151a;
        cursor: default;
      }
      #canvas-inner {
        position: absolute;
        inset: 0;
        /* Must outrank #stream-preview-overlay's z-index (both are
           position:absolute siblings under #canvas-container) so canvas
           assets render *in front of* the stream preview, not behind it --
           the whole point of the preview is to see assets composited over
           the real stream, not have it cover them. */
        z-index: 10;
      }
      /* Sibling of #canvas-inner (not a child of it) so CanvasView's own
         dispose()-on-room-switch (which wipes #canvas-inner's contents
         entirely) never touches this -- see streamPreview.ts. Below
         #canvas-inner's z-index so assets/embed cover the placeholder
         shown here when no channel is configured. */
      #stream-preview-overlay {
        display: none;
        pointer-events: none;
        z-index: 1;
      }
      /* A separate element (not nested inside #stream-preview-overlay,
         which sits *below* canvas assets) so its always-on-top boundary
         line can render *above* assets too -- the whole point is staying
         visible even when an asset is dragged across the boundary. */
      #stream-preview-border {
        display: none;
        pointer-events: none;
        z-index: 20;
      }
      .stream-preview-border-strip {
        position: absolute;
        backdrop-filter: invert(1);
        -webkit-backdrop-filter: invert(1);
      }
      .stream-preview-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #ccc;
        margin-bottom: 6px;
      }
      .stream-preview-row label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .stream-preview-row select {
        margin-left: auto;
        background: #1e1f24;
        border: 1px solid #454650;
        color: #eee;
        border-radius: 4px;
        font-size: 12px;
        padding: 2px 4px;
      }
      #stream-settings-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 210;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
      }
      .stream-settings-content {
        width: 320px;
        background: #26272e;
        border: 1px solid #444;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        padding: 12px;
        box-sizing: border-box;
      }
      .stream-settings-content input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        background: #1e1f24;
        border: 1px solid #454650;
        color: #eee;
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 13px;
        margin-bottom: 4px;
      }
      .stream-settings-content .toolbar-button {
        width: 100%;
        margin-top: 8px;
        justify-content: center;
      }
      #canvas-container img,
      #canvas-container video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        -webkit-user-drag: none;
        user-drag: none;
      }
      #canvas-container [data-asset-type="text"] {
        color: white;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px;
        box-sizing: border-box;
      }
      #context-menu {
        display: none;
        position: fixed;
        z-index: 100;
        min-width: 160px;
        background: #26272e;
        border: 1px solid #444;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      #access-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
      }
      .access-modal-content {
        width: 360px;
        max-height: 80vh;
        overflow-y: auto;
        background: #26272e;
        border: 1px solid #444;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        padding: 12px;
        box-sizing: border-box;
      }
      .access-section {
        background: #2b2c34;
        border-radius: 6px;
        padding: 8px;
        margin-top: 8px;
      }
      .access-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 2px;
        font-size: 13px;
      }
      .access-row-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .access-row-sub {
        color: #999;
        font-size: 11px;
      }
      .access-empty {
        color: #888;
        font-size: 12px;
        padding: 4px 2px;
      }
      .access-status {
        color: #4da3ff;
        font-size: 12px;
        min-height: 14px;
        margin-top: 6px;
      }
      #context-menu .context-menu-header {
        padding: 8px 12px;
        font-size: 12px;
        color: #888;
        border-bottom: 1px solid #383838;
      }
      #context-menu button {
        display: block;
        width: 100%;
        padding: 8px 12px;
        text-align: left;
        background: none;
        border: none;
        color: #eee;
        cursor: pointer;
      }
      #context-menu button:hover {
        background: #3a3b44;
      }
      #login-view {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      #login-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 260px;
        padding: 24px;
        background: #26272e;
        border-radius: 8px;
      }
      #login-form input {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #1e1f24;
        color: #eee;
      }
      #login-form .buttons {
        display: flex;
        gap: 8px;
      }
      #login-form .buttons button {
        flex: 1;
      }
      #login-error {
        color: #ff6b6b;
        font-size: 13px;
        min-height: 16px;
      }
      #login-message {
        color: #4da3ff;
        font-size: 13px;
        min-height: 16px;
      }
      #login-hint {
        color: #888;
        font-size: 12px;
      }
      #resend-verification-button {
        width: 100%;
      }
      #room-picker-view {
        display: none;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      #room-picker {
        display: flex;
        flex-direction: column;
        width: 400px;
        max-height: 80vh;
        overflow-y: auto;
        padding: 24px;
        background: #26272e;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .room-picker-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      #room-picker h2 {
        margin: 0;
        font-size: 16px;
      }
      .room-picker-logout {
        background: none;
        border: none;
        color: #999;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        padding: 4px;
      }
      .room-picker-logout:hover {
        color: #eee;
        text-decoration: underline;
      }
      [data-role="room-picker-list"] {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .room-picker-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border-radius: 6px;
        background: #2b2c34;
        border: 1px solid #383838;
        cursor: pointer;
        text-align: left;
        color: #eee;
        font: inherit;
      }
      .room-picker-row:hover {
        background: #34353e;
        border-color: #4da3ff;
      }
      .room-picker-row-title {
        font-size: 14px;
        font-weight: 600;
      }
      .room-picker-row-sub {
        font-size: 12px;
        color: #999;
      }
      .room-picker-section-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #888;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="login-view">
      <form id="login-form">
        <input id="login-username" type="text" placeholder="Username" autocomplete="username" minlength="3" />
        <input id="login-email" type="email" placeholder="Email (for registration)" autocomplete="email" />
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" minlength="8" />
        <div id="login-hint">Registering requires a username of 3+ characters, a valid email, and a password of 8+ characters. We'll email you a verification link before you can log in.</div>
        <div id="login-error"></div>
        <div id="login-message"></div>
        <div class="buttons">
          <button id="login-button" type="submit">Log in</button>
          <button id="register-button" type="button">Register</button>
        </div>
        <button id="resend-verification-button" type="button" style="display: none">Resend verification email</button>
      </form>
    </div>
    <div id="room-picker-view"></div>
    <div id="app-view">
      <div id="toolbar">
        <button id="dashboard-button" type="button">&laquo; Dashboard</button>
        <input id="upload-input" type="file" accept="image/*,video/*,audio/*" style="display: none" />
        <button id="manage-access-button" class="toolbar-button">Manage access</button>
        <button id="copy-browser-source-button" class="toolbar-button">Copy browser source URL</button>
        <span id="status"></span>
      </div>
      <div id="main-area">
        <div id="sidebar">
          <div id="sidebar-top">
            <div id="stream-preview-panel"></div>
            <div id="sound-panel"></div>
            <div id="objects-panel"></div>
            <div id="connected-users-panel"></div>
            <div id="variables-panel"></div>
          </div>
          <div id="sidebar-bottom">
            <div id="properties-panel"></div>
          </div>
        </div>
        <div id="canvas-container">
          <div id="canvas-inner"></div>
          <div id="stream-preview-overlay"></div>
          <div id="stream-preview-border"></div>
        </div>
      </div>
      <div id="context-menu">
        <div class="context-menu-header">Create</div>
        <button id="context-menu-text" type="button">Text</button>
        <button id="context-menu-media" type="button">Media</button>
      </div>
      <div id="access-modal"></div>
      <div id="stream-settings-modal"></div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
